get:
  summary: List all wikis
  description: >-
    List of wiki pages on a node.

    #### Returns

    Paginated list of the node's current wiki page versions ordered by their date_modified.
    Each resource contains the full representation of the wiki, meaning additional requests
    to an individual wiki's detail view are not necessary.


    Note that if an anonymous view_only key is being used, the user relationship will not be exposed.


    If the request is unsuccessful, a JSON object with an `errors` key containing
    information about the failure will be returned. Refer to the [list of error codes](#tag/Errors-and-Error-Codes)
    to understand why this request may have failed.

    #### Filtering

    Wiki pages can be filtered based on their `name` and `date_modified` fields.

    + `filter[name]=<Str>` -- filter wiki pages by name

    + `filter[date_modified][comparison_operator]=YYYY-MM-DDTH:M:S` -- filter wiki pages based on date modified.


    Possible comparison operators include 'gt' (greater than), 'gte'(greater than or equal to), 'lt' (less than) and 'lte' (less than or equal to). The date must be in the format YYYY-MM-DD and the time is optional.

  parameters:
    - in: path
      type: string
      name: node_id
      required: true
      description: 'The unique identifier of the node.'
  tags:
    - Nodes
  operationId: nodes_wikis_list
  x-response-schema: Wiki
  responses:
    '200':
      description: OK
      schema:
        type: array
        items:
          $ref: '../wikis/definition.yaml'
      examples:
        application/json:
          data:
            - relationships:
                node:
                  links:
                    related:
                      href: 'https://api.osf.io/v2/nodes/tvyxz/'
                      meta: {}
                user:
                  links:
                    related:
                      href: 'https://api.osf.io/v2/users/5k3hq/'
                      meta: {}
                comments:
                  links:
                    related:
                      href: 'https://api.osf.io/v2/nodes/tvyxz/comments/?filter%5Btarget%5D=zveyb'
                      meta: {}
              links:
                info: 'https://api.osf.io/v2/wikis/zveyb/'
                download: 'https://api.osf.io/v2/wikis/zveyb/content/'
                self: 'https://api.osf.io/v2/wikis/zveyb/'
              attributes:
                kind: 'file'
                name: 'home'
                date_modified: '2017-02-16T15:45:57.671957'
                extra:
                  version: 47
                content_type: 'text/markdown'
                path: '/zveyb'
                current_user_can_comment: true
                materialized_path: '/zveyb'
                size: 552
              type: 'wikis'
              id: 'xu77p'
          links:
            first: ''
            last: https://api.osf.io/v2/wikis/zveyb/?page=2
            prev: ''
            next: https://api.osf.io/v2/wikis/zveyb/?page=2
            meta:
              total: 12
              per_page: 10

post:
  summary: Create a Wiki
  description: >-
    Creates a new wiki page on the node with the given `name` and, optionally, initial `content`.


    A wiki page with the given name must not already exist on the node; attempting to create a
    duplicate will result in a **409 Conflict** response.

    #### Permissions

    Only contributors with write access to the node may create a wiki page (or any user, if the
    node's wiki has been made publicly editable).

    #### Returns

    Returns a JSON object with a `data` key containing the representation of the newly created
    wiki, if the request is successful.


    If the request is unsuccessful, an `errors` key containing information about the failure will
    be returned. Refer to the [list of error codes](#tag/Errors-and-Error-Codes) to understand why
    this request may have failed.

    Some common error cases:
     - `405 Method Not Allowed`: Returned if write access to this node has been restricted. The response will include the message "This action is no longer available. Contact support if you have any questions."

  parameters:
    - in: path
      type: string
      name: node_id
      required: true
      description: 'The unique identifier of the node.'
    - in: body
      name: body
      required: true
      schema:
        type: object
        example:
          data:
            type: 'wikis'
            attributes:
              name: 'A New Page'
              content: 'Some initial content for the page.'
  tags:
    - Nodes
  operationId: nodes_wikis_create
  x-response-schema: Wiki
  consumes:
    - application/json
  responses:
    '201':
      description: 'Created'
    '405':
      description: Returned if write access to this node has been restricted. The response will include the message "This action is no longer available. Contact support if you have any questions."
